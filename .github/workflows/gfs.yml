name: GFS grid

# Builds the global 0.5° GFS grid for the map and publishes it to the `gfs-data`
# branch (a single force-pushed commit, so the repository does not grow).
# The app reads it from raw.githubusercontent.com — see GFS in js/config.js.

on:
  schedule:
    # GFS runs at 00/06/12/18 UTC and is complete out to +120 h roughly 4 h later.
    - cron: '25 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gfs-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch and convert GFS
        id: gfs
        run: >
          python scripts/fetch_gfs.py --out out
          --skip-if-current "https://raw.githubusercontent.com/${{ github.repository }}/gfs-data/manifest.json"

      - name: Publish to gfs-data branch
        if: steps.gfs.outputs.updated == 'true'
        working-directory: out
        run: |
          git init -q -b gfs-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "GFS ${{ steps.gfs.outputs.run }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gfs-data
